<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公衛實習資訊網</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

    <div class="carousel-container">
        <div class="carousel-slide">
            <img src="./images/banner1.png" alt="實習 Banner 1">
            <img src="./images/banner2.png" alt="實習 Banner 2">
            <img src="./images/banner3.png" alt="實習 Banner 3">
        </div>
    </div>

    <main class="container">

        <section class="info-section">
            <h2>最新公告</h2>
            <div class="announcement-container">
                <div class="news-item">
                    <span class="news-date">2026-05-30</span>
                    <span class="news-category tag-important">重要</span>
                    <a href="#" class="news-title">XXX年XX月XX日(X)12:10-13:00「實習志願選填說明會」</a>
                </div>
                <div class="news-item">
                    <span class="news-date">2026-05-29</span>
                    <span class="news-category tag-normal">公告</span>
                    <a href="#" class="news-title">實習志願選填表單開放日期：XXX/XX/XX(五)~XXX/XX/XX(日)</a>
                </div>
            </div>
        </section>

        <section class="info-section">
            <h2>近期重要時程</h2>
            <div class="timeline-node">
                <div class="node-date"> XX 月 XX 日 </div>
                <div class="node-content">12:10-13:00實習志願選填說明會</div>
            </div>
            <div class="timeline-node">
                <div class="node-date"> XX 月 XX 日 </div>
                <div class="node-content">實習志願選填表單開放</div>
            </div>
            <div class="timeline-node">
                <div class="node-date"> XX 月 XX 日 </div>
                <div class="node-content">實習志願選填表單截止</div>
            </div>
        </section>

        <section class="info-section">
            <h2>快速功能</h2>
            <div class="quick-grid">
                <a href="faq.html" class="quick-card">
                    <h3><img src="./images/help.png" alt="faqIcon" class="card-icon">
                        常見問答
                    </h3>
                    <p>實習辦法、時數規定等常見疑問快速查詢</p>
                </a>
                <a href="org_info.html" class="quick-card">
                    <h3><img src="./images/pharmacy.png" alt="orgIcon" class="card-icon">
                        單位介紹
                    </h3>
                    <p>歷年醫療機構、公家機關與常態實習單位資訊</p>
                </a>
                <a href="senior_ep.html" class="quick-card">
                    <h3><img src="./images/checklist.png" alt="epIcon" class="card-icon">
                        實習成果
                    </h3>
                    <p>學長姐實習心得分享與優秀發表活動紀錄</p>
                </a>
            </div>
        </section>

    </main>

    <script src="./js/main.js"></script>

</body>

</html>
